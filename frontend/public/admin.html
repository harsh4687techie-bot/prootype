<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Admin Panel - Contact Management">
    <meta name="robots" content="noindex, nofollow">
    <title>Admin Panel - Contact Management</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #64ffda;
            --secondary-color: #0a192f;
            --text-dark: #0a192f;
            --text-light: #8892b0;
            --bg-dark: #0a192f;
            --bg-light: #112240;
            --border-color: #233554;
            --error-color: #ff6b6b;
            --success-color: #51cf66;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: #8892b0;
            line-height: 1.6;
        }

        .admin-container {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background-color: var(--bg-light);
            border-right: 1px solid var(--border-color);
            padding: 20px;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }

        .sidebar-header {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-title {
            color: var(--primary-color);
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .sidebar-nav {
            list-style: none;
        }

        .sidebar-nav li {
            margin-bottom: 10px;
        }

        .sidebar-nav a {
            display: block;
            padding: 12px 15px;
            color: var(--text-light);
            text-decoration: none;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .sidebar-nav a:hover,
        .sidebar-nav a.active {
            background-color: rgba(100, 255, 218, 0.1);
            color: var(--primary-color);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: 250px;
        }

        /* Header */
        .admin-header {
            background-color: var(--bg-light);
            border-bottom: 1px solid var(--border-color);
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-title {
            color: var(--primary-color);
            font-size: 1.5rem;
            font-weight: 600;
        }

        .header-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn {
            padding: 10px 20px;
            border: 2px solid var(--primary-color);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: var(--bg-dark);
            border-color: var(--primary-color);
        }

        .btn-primary:hover {
            opacity: 0.8;
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--primary-color);
        }

        .btn-secondary:hover {
            background-color: rgba(100, 255, 218, 0.1);
        }

        .btn-danger {
            color: var(--error-color);
            border-color: var(--error-color);
        }

        .btn-danger:hover {
            background-color: rgba(255, 107, 107, 0.1);
        }

        /* Page Content */
        .page-content {
            padding: 30px;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background-color: var(--bg-light);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .stat-label {
            color: var(--text-light);
            font-size: 0.9rem;
        }

        /* Table */
        .table-container {
            background-color: var(--bg-light);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background-color: rgba(100, 255, 218, 0.1);
            padding: 15px;
            text-align: left;
            color: var(--primary-color);
            font-weight: 600;
            border-bottom: 2px solid var(--border-color);
        }

        td {
            padding: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        tr:hover {
            background-color: rgba(100, 255, 218, 0.05);
        }

        tr:last-child td {
            border-bottom: none;
        }

        /* Status Badge */
        .badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .badge-pending {
            background-color: rgba(255, 193, 7, 0.2);
            color: #ffc107;
        }

        .badge-read {
            background-color: rgba(100, 200, 255, 0.2);
            color: #64c8ff;
        }

        .badge-replied {
            background-color: rgba(81, 207, 102, 0.2);
            color: var(--success-color);
        }

        .badge-spam {
            background-color: rgba(255, 107, 107, 0.2);
            color: var(--error-color);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background-color: var(--bg-light);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            color: var(--primary-color);
            font-size: 1.5rem;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .modal-close:hover {
            color: var(--primary-color);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--primary-color);
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: var(--bg-dark);
            color: #8892b0;
            font-family: 'Inter', sans-serif;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* Search & Filter */
        .controls-section {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
        }

        .search-box input {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: var(--bg-light);
            color: #8892b0;
        }

        .filter-select {
            padding: 10px 15px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: var(--bg-light);
            color: #8892b0;
        }

        /* Loading & Messages */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-light);
        }

        .alert {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .alert-success {
            background-color: rgba(81, 207, 102, 0.1);
            color: var(--success-color);
            border: 1px solid var(--success-color);
        }

        .alert-error {
            background-color: rgba(255, 107, 107, 0.1);
            color: var(--error-color);
            border: 1px solid var(--error-color);
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
            }

            .main-content {
                margin-left: 0;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .table-container {
                overflow-x: auto;
            }

            table {
                min-width: 600px;
            }

            .header-actions {
                flex-direction: column;
                width: 100%;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">Admin Panel</div>
                <p style="font-size: 0.85rem; color: var(--text-light);">Contact Management</p>
            </div>
            <nav>
                <ul class="sidebar-nav">
                    <li><a href="#dashboard" class="nav-link active">📊 Dashboard</a></li>
                    <li><a href="#contacts" class="nav-link">📧 All Contacts</a></li>
                    <li><a href="#pending" class="nav-link">⏳ Pending</a></li>
                    <li><a href="#spam" class="nav-link">🚫 Spam</a></li>
                    <li><a href="#settings" class="nav-link">⚙️ Settings</a></li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="admin-header">
                <h1 class="header-title">Contact Management Dashboard</h1>
                <div class="header-actions">
                    <button class="btn btn-secondary" id="refreshBtn">🔄 Refresh</button>
                    <button class="btn btn-secondary" id="exportBtn">📥 Export CSV</button>
                    <button class="btn btn-secondary" id="logoutBtn">🚪 Logout</button>
                </div>
            </header>

            <!-- Page Content -->
            <div class="page-content">
                <!-- Alerts -->
                <div id="alertContainer"></div>

                <!-- Stats section -->
                <div class="stats-grid" id="statsContainer">
                    <div class="stat-card">
                        <div class="stat-number" id="totalStat">0</div>
                        <div class="stat-label">Total Messages</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="pendingStat">0</div>
                        <div class="stat-label">Pending</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="readStat">0</div>
                        <div class="stat-label">Read</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="spamStat">0</div>
                        <div class="stat-label">Spam</div>
                    </div>
                </div>

                <!-- Controls -->
                <div class="controls-section">
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="Search by name, email...">
                    </div>
                    <select id="statusFilter" class="filter-select">
                        <option value="all">All Status</option>
                        <option value="PENDING">Pending</option>
                        <option value="READ">Read</option>
                        <option value="REPLIED">Replied</option>
                        <option value="SPAM">Spam</option>
                    </select>
                </div>

                <!-- Table -->
                <div class="table-container">
                    <table id="contactsTable">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Subject</th>
                                <th>Status</th>
                                <th>Received</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="contactsTableBody">
                            <tr>
                                <td colspan="6" class="loading">Loading...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- View Contact Modal -->
    <div id="contactModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Contact Details</h2>
                <button class="modal-close" onclick="closeContactModal()">&times;</button>
            </div>
            <div id="contactModalBody"></div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/v1';
        let currentPage = 1;
        const currentStatus = 'all';

        // Load contacts on page load
        document.addEventListener('DOMContentLoaded', () => {
            loadStats();
            loadContacts();
            setupEventListeners();
        });

        function setupEventListeners() {
            document.getElementById('refreshBtn').addEventListener('click', () => {
                loadStats();
                loadContacts();
            });

            document.getElementById('exportBtn').addEventListener('click', exportContacts);
            document.getElementById('logoutBtn').addEventListener('click', logout);
            document.getElementById('searchInput').addEventListener('input', debounce(loadContacts, 500));
            document.getElementById('statusFilter').addEventListener('change', loadContacts);
        }

        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/admin/contacts/stats`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('adminToken')}`
                    }
                });

                if (!response.ok) throw new Error('Failed to load stats');

                const data = await response.json();
                document.getElementById('totalStat').textContent = data.data.total;
                document.getElementById('pendingStat').textContent = data.data.pending;
                document.getElementById('readStat').textContent = data.data.read;
                document.getElementById('spamStat').textContent = data.data.spam;
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        async function loadContacts() {
            try {
                const search = document.getElementById('searchInput').value;
                const status = document.getElementById('statusFilter').value;

                const params = new URLSearchParams({
                    page: currentPage,
                    perPage: 10,
                    search,
                    status
                });

                const response = await fetch(`${API_BASE}/admin/contacts?${params}`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('adminToken')}`
                    }
                });

                if (!response.ok) throw new Error('Failed to load contacts');

                const data = await response.json();
                renderContacts(data.data);
            } catch (error) {
                console.error('Error loading contacts:', error);
                showAlert('Error loading contacts', 'error');
            }
        }

        function renderContacts(contacts) {
            const tbody = document.getElementById('contactsTableBody');
            
            if (contacts.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; padding: 40px;">No contacts found</td></tr>';
                return;
            }

            tbody.innerHTML = contacts.map(contact => `
                <tr>
                    <td>${contact.name}</td>
                    <td>${contact.email}</td>
                    <td>${contact.subject}</td>
                    <td><span class="badge badge-${contact.status.toLowerCase()}">${contact.status}</span></td>
                    <td>${new Date(contact.createdAt).toLocaleDateString()}</td>
                    <td>
                        <button class="btn btn-secondary" onclick="viewContact('${contact.id}')">View</button>
                        <button class="btn btn-danger" onclick="deleteContact('${contact.id}')">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        async function viewContact(id) {
            try {
                const response = await fetch(`${API_BASE}/admin/contacts/${id}`, {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('adminToken')}` }
                });

                const data = await response.json();
                const contact = data.data;

                const modalBody = document.getElementById('contactModalBody');
                modalBody.innerHTML = `
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" value="${contact.name}" readonly>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="text" value="${contact.email}" readonly>
                    </div>
                    <div class="form-group">
                        <label>Phone</label>
                        <input type="text" value="${contact.phone || 'N/A'}" readonly>
                    </div>
                    <div class="form-group">
                        <label>Subject</label>
                        <input type="text" value="${contact.subject}" readonly>
                    </div>
                    <div class="form-group">
                        <label>Message</label>
                        <textarea readonly>${contact.message}</textarea>
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select id="statusSelect" onchange="updateStatus('${contact.id}', this.value)">
                            <option value="PENDING" ${contact.status === 'PENDING' ? 'selected' : ''}>Pending</option>
                            <option value="READ" ${contact.status === 'READ' ? 'selected' : ''}>Read</option>
                            <option value="REPLIED" ${contact.status === 'REPLIED' ? 'selected' : ''}>Replied</option>
                            <option value="SPAM" ${contact.status === 'SPAM' ? 'selected' : ''}>Spam</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Admin Notes</label>
                        <textarea id="notesField" placeholder="Add notes...">${contact.notes || ''}</textarea>
                    </div>
                    <button class="btn btn-primary" onclick="saveNotes('${contact.id}')">Save Notes</button>
                `;

                document.getElementById('contactModal').classList.add('active');
            } catch (error) {
                console.error('Error viewing contact:', error);
                showAlert('Error loading contact details', 'error');
            }
        }

        async function updateStatus(id, status) {
            try {
                const response = await fetch(`${API_BASE}/admin/contacts/${id}`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('adminToken')}`
                    },
                    body: JSON.stringify({ status })
                });

                if (response.ok) {
                    showAlert('Status updated successfully', 'success');
                    loadStats();
                    loadContacts();
                }
            } catch (error) {
                console.error('Error updating status:', error);
            }
        }

        async function saveNotes(id) {
            const notes = document.getElementById('notesField').value;
            const status = document.getElementById('statusSelect').value;

            try {
                const response = await fetch(`${API_BASE}/admin/contacts/${id}`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('adminToken')}`
                    },
                    body: JSON.stringify({ status, notes })
                });

                if (response.ok) {
                    showAlert('Notes saved successfully', 'success');
                    loadContacts();
                }
            } catch (error) {
                console.error('Error saving notes:', error);
            }
        }

        async function deleteContact(id) {
            if (!confirm('Are you sure you want to delete this contact?')) return;

            try {
                const response = await fetch(`${API_BASE}/admin/contacts/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('adminToken')}` }
                });

                if (response.ok) {
                    showAlert('Contact deleted successfully', 'success');
                    loadStats();
                    loadContacts();
                }
            } catch (error) {
                console.error('Error deleting contact:', error);
            }
        }

        async function exportContacts() {
            try {
                const status = document.getElementById('statusFilter').value;
                const url = `${API_BASE}/admin/contacts/export/csv${status !== 'all' ? `?status=${status}` : ''}`;
                
                const response = await fetch(url, {
                    headers: { 'Authorization': `Bearer ${localStorage.getItem('adminToken')}` }
                });

                const blob = await response.blob();
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = `contacts-${new Date().toISOString().split('T')[0]}.csv`;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(downloadUrl);

                showAlert('Contacts exported successfully', 'success');
            } catch (error) {
                console.error('Error exporting:', error);
                showAlert('Error exporting contacts', 'error');
            }
        }

        function closeContactModal() {
            document.getElementById('contactModal').classList.remove('active');
        }

        function showAlert(message, type) {
            const container = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            container.appendChild(alert);

            setTimeout(() => alert.remove(), 3000);
        }

        function logout() {
            localStorage.removeItem('adminToken');
            window.location.href = '/';
        }

        function debounce(func, wait) {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), wait);
            };
        }
    </script>
</body>
</html>
